<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigitMatchStars Pro™ - Official Deriv Trading Bot</title>
  <meta name="description" content="Deriv trading bot with OAuth2 PKCE and Options API account selection.">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Inter', sans-serif; }
    body {
      background: linear-gradient(135deg,#0a0f1f,#0f172a);
      color:#f8fafc;
      min-height:100vh;
    }
    .gradient-text {
      background: linear-gradient(135deg,#10b981,#3b82f6,#8b5cf6);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .glass-card {
      background:rgba(255,255,255,.04);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.1);
      border-radius:20px;
    }
    .btn-primary,.btn-secondary,.btn-danger {
      padding:14px 28px;
      border-radius:12px;
      font-weight:700;
    }
    .btn-primary { background:linear-gradient(135deg,#10b981,#059669); }
    .btn-secondary { background:linear-gradient(135deg,#8b5cf6,#7c3aed); }
    .btn-danger { background:linear-gradient(135deg,#ef4444,#dc2626); }
    .modal {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.9);
      z-index:9999;
      align-items:center;
      justify-content:center;
      padding:16px;
    }
    .modal-content {
      background:linear-gradient(135deg,#0f172a,#0a0f1f);
      padding:36px;
      border-radius:24px;
      max-width:560px;
      width:100%;
      border:1px solid rgba(255,255,255,.1);
    }
  </style>

  <script>
    const CONFIG = {
      CLIENT_ID: "34uXWAMOwfAO5EtltnV4n",
      REDIRECT_URI: "https://derivmatchstars.vercel.app",
      AFFILIATE_URL: "https://partner-tracking.deriv.com/click?a=20638&o=1&c=3&link_id=1",
      REFERRAL_CODE: "3655J683S288"
    };

    function generateRandomString(length = 64) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
      const values = new Uint8Array(length);
      crypto.getRandomValues(values);
      return Array.from(values, value => chars[value % chars.length]).join("");
    }

    async function sha256(text) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    }

    function base64UrlEncode(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)))
        .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    }

    function normalizeAccounts(data) {
      const accounts = Array.isArray(data?.accounts) ? data.accounts :
                       Array.isArray(data?.data) ? data.data :
                       data?.data ? [data.data] : [];
      return accounts.filter(a => a && a.account_id);
    }

    function saveSession(token, account, tokenData, mode) {
      const accountMode = String(account.account_type || mode || "").toUpperCase() === "REAL" ? "REAL" : "DEMO";

      localStorage.setItem("active_token", token);
      localStorage.setItem("derivToken", token);
      localStorage.setItem("bot_authenticated", "true");
      localStorage.setItem("auth_method", "oauth2_pkce");
      localStorage.setItem("selectedAccountMode", accountMode);
      localStorage.setItem("derivAccount", account.account_id);
      localStorage.setItem("active_account", account.account_id);
      localStorage.setItem("deriv_accounts", JSON.stringify([account]));
      localStorage.setItem("deriv_client_id", CONFIG.CLIENT_ID);
      localStorage.setItem("auto_open_bot", "true");

      if (accountMode === "REAL") {
        localStorage.setItem("derivRealAccount", account.account_id);
      } else {
        localStorage.setItem("derivDemoAccount", account.account_id);
      }

      if (tokenData?.token_type) localStorage.setItem("deriv_token_type", tokenData.token_type);
      if (tokenData?.expires_in) {
        localStorage.setItem("deriv_token_expires_at", String(Date.now() + Number(tokenData.expires_in) * 1000));
      }
    }

    async function getOptionsAccounts(accessToken) {
      const response = await fetch("/api/deriv-accounts", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ token: accessToken, auth_method:"oauth2_pkce" })
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || data.error_description || "Could not retrieve Deriv Options accounts");
      }
      return normalizeAccounts(data);
    }

    async function handleOAuthCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const returnedState = params.get("state");
      const error = params.get("error");
      const errorDescription = params.get("error_description");

      if (error) {
        alert("Deriv authentication failed: " + (errorDescription || error));
        history.replaceState({}, document.title, "/index.html");
        return;
      }

      if (!code) return;

      const expectedState = sessionStorage.getItem("deriv_oauth_state");
      const codeVerifier = sessionStorage.getItem("deriv_code_verifier");
      const requestedMode = sessionStorage.getItem("deriv_requested_mode") || "DEMO";

      if (!expectedState || returnedState !== expectedState) {
        alert("Security error: OAuth state mismatch. Please connect again.");
        history.replaceState({}, document.title, "/index.html");
        return;
      }

      if (!codeVerifier) {
        alert("OAuth session expired. Please connect again.");
        history.replaceState({}, document.title, "/index.html");
        return;
      }

      try {
        const status = document.getElementById("authStatus");
        if (status) status.textContent = "Completing Deriv authentication...";

        const tokenResponse = await fetch("/api/deriv-token", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            code,
            code_verifier:codeVerifier,
            redirect_uri:CONFIG.REDIRECT_URI,
            client_id:CONFIG.CLIENT_ID
          })
        });

        const tokenData = await tokenResponse.json().catch(() => ({}));
        if (!tokenResponse.ok || !tokenData.access_token) {
          throw new Error(tokenData.error_description || tokenData.error || "Token exchange failed");
        }

        if (status) status.textContent = "Loading your Deriv Options accounts...";
        const accounts = await getOptionsAccounts(tokenData.access_token);

        if (!accounts.length) {
          throw new Error("No Deriv Options trading account was returned for this login.");
        }

        const wanted = requestedMode.toLowerCase();
        const selected =
          accounts.find(a => String(a.account_type || "").toLowerCase() === wanted) ||
          accounts[0];

        if (requestedMode === "REAL" &&
            String(selected.account_type || "").toLowerCase() !== "real") {
          throw new Error("No REAL Deriv Options account is available for this login.");
        }

        saveSession(tokenData.access_token, selected, tokenData, requestedMode);

        sessionStorage.removeItem("deriv_oauth_state");
        sessionStorage.removeItem("deriv_code_verifier");
        sessionStorage.removeItem("deriv_requested_mode");

        window.location.replace("/bot-obfuscated.html");
      } catch (err) {
        console.error(err);
        alert("Could not complete Deriv authentication: " + err.message);
        history.replaceState({}, document.title, "/index.html");
      }
    }

    async function startOAuth(mode) {
      if (!CONFIG.CLIENT_ID) {
        alert("Set CONFIG.CLIENT_ID first.");
        return;
      }

      const codeVerifier = generateRandomString(64);
      const state = generateRandomString(32);
      const codeChallenge = base64UrlEncode(await sha256(codeVerifier));

      sessionStorage.setItem("deriv_code_verifier", codeVerifier);
      sessionStorage.setItem("deriv_oauth_state", state);
      sessionStorage.setItem("deriv_requested_mode", mode);

      const params = new URLSearchParams({
        response_type:"code",
        client_id:CONFIG.CLIENT_ID,
        redirect_uri:CONFIG.REDIRECT_URI,
        scope:"trade account_manage",
        state,
        code_challenge:codeChallenge,
        code_challenge_method:"S256"
      });

      window.location.href = `https://auth.deriv.com/oauth2/auth?${params.toString()}`;
    }

    function createAccount() {
      window.open(CONFIG.AFFILIATE_URL, "_blank");
    }

    function openModal() {
      document.getElementById("authModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("authModal").style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", handleOAuthCallback);
  </script>
</head>

<body>
  <nav class="glass-card fixed top-6 left-1/2 -translate-x-1/2 w-[95%] max-w-6xl px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-full bg-gradient-to-r from-green-500 to-blue-600 flex items-center justify-center">
        <i class="fas fa-robot text-white text-xl"></i>
      </div>
      <span class="text-2xl font-bold gradient-text">DigitMatchStars Pro™</span>
    </div>
    <button onclick="openModal()" class="btn-primary">Connect</button>
  </nav>

  <section class="pt-44 pb-24 text-center px-6">
    <h1 class="text-5xl md:text-7xl font-bold mb-6">
      <span class="gradient-text">Deriv Options</span><br>Live Connection
    </h1>
    <p id="authStatus" class="text-gray-300 mb-8">
      Connect securely using Deriv OAuth2. Choose demo or real explicitly.
    </p>
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <button onclick="startOAuth('DEMO')" class="btn-secondary text-lg">Connect DEMO</button>
      <button onclick="startOAuth('REAL')" class="btn-danger text-lg">Connect REAL</button>
      <button onclick="createAccount()" class="btn-primary text-lg">Create Deriv Account</button>
    </div>
  </section>

  <div id="authModal" class="modal">
    <div class="modal-content">
      <button onclick="closeModal()" class="float-right text-white text-2xl">&times;</button>
      <h2 class="text-3xl font-bold mb-4 text-center">Choose account mode</h2>
      <p class="text-sm text-gray-400 mb-6 text-center">
        REAL uses real funds. DEMO uses virtual funds.
      </p>
      <div class="space-y-4">
        <button onclick="startOAuth('DEMO')" class="w-full btn-secondary">Connect DEMO account</button>
        <button onclick="startOAuth('REAL')" class="w-full btn-danger">Connect REAL account</button>
      </div>
    </div>
  </div>
</body>
</html>
