services:
  - type: web
    name: digitmatchstar-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DERIV_CLIENT_ID
        sync: false
      - key: DERIV_REDIRECT_URI
        sync: false
      - key: DERIV_LEGACY_APP_ID
        sync: false
      - key: DERIV_SCOPE
        value: "trade"
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PLATFORM_JWT_SECRET
        sync: false
      - key: PLATFORM_JWT_ALGORITHM
        value: "HS256"
      - key: TRUST_PLATFORM_USER_HEADER
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: ALLOW_REAL_MODE
        value: "false"
