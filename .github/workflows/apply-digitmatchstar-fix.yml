name: Fix DigitMatchStar Rank Sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch code and compile
        run: |
          python tools/fix_rank_sync.py
          python -m compileall -q app
      - name: Commit complete corrected files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py app/__init__.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix canonical ranking snapshot and gated next target'
            git push
          fi
