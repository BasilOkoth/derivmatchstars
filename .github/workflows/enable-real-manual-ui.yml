name: Connect REAL Start Button to Manual Confirm
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update full bot.html
        run: python tools/apply_real_ui.py
      - name: Commit modified frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.html
          if ! git diff --cached --quiet; then
            git commit -m 'Route REAL Start through one-trade manual confirmation'
            git push
          fi
